<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171621">
<meta name="description" content="A little letter, sealed with love.">
<title>A Letter for You | PickMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --k:1;
 --bg1:#302332;--bg2:#171621;--hint:#F095AA;
 --ink:#392431;--paper:#FFF5F5;--paper2:#F3DDE4;
 --eb:#7D2948;--ef:#BE5678;--ff:#E7A0B2;--fk:#A83D5C;
 --rose:#BE123C;--plum:#7D2948;--blush:#F095AA;--cream:#FFF5F5;
 box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);
 padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{width:100%;height:100%;min-width:320px;overflow:hidden;background:var(--bg2)}
body{margin:0;width:100%;height:100%;overflow:hidden;background:
 radial-gradient(ellipse 68% 55% at 50% 38%,rgba(190,18,60,.22),transparent 72%),
 radial-gradient(ellipse 50% 40% at 8% 90%,rgba(125,41,72,.22),transparent 72%),
 linear-gradient(145deg,var(--bg1),var(--bg2) 62%,#241724);
 color:#F7F3FA;font-family:"Manrope",sans-serif}
.scene{
 position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);
 perspective:1400px;overflow:hidden;-webkit-tap-highlight-color:transparent;--lh:39px
}
.page-title{
 position:absolute;z-index:25;top:clamp(16px,4vh,34px);left:58px;right:58px;margin:0;
 color:#F7F3FA;text-align:center;font:400 clamp(24px,5vw,34px)/1.1 "DM Serif Display",serif;
 letter-spacing:-.025em;text-wrap:balance;pointer-events:none
}
.nav-back{
 position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));
 width:42px;height:42px;display:grid;place-items:center;border:1.5px solid rgba(240,149,170,.55);
 border-radius:13px;background:rgba(41,31,47,.78);color:#F7F3FA;text-decoration:none;
 box-shadow:3px 3px 0 rgba(13,11,19,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 transition:background .2s ease,transform .2s ease
}
.nav-back:hover{background:#7D2948;transform:translateX(-2px)}
.nav-back:focus-visible,.seal:focus-visible,.replay:focus-visible,.sheet:focus-visible{outline:3px solid #F0D17D;outline-offset:4px}
.eb,.ef,.fl,.seal,.lt,.sheet{position:absolute;left:50%;top:50%}
/* Envelope body and folded front */
.eb,.ef{width:var(--E);height:var(--EH);margin:0}
.eb,.ef{
 transform:translate(-50%,-50%) translateY(var(--dy))
}
.s-out .eb,.s-out .ef{
 transition:transform .9s cubic-bezier(.55,0,.8,.45),opacity .9s ease-in
}
.fl{
 transform:translate(-50%,-50%) translateY(var(--flapY))
}
.s-out .fl{
 transition:transform .9s cubic-bezier(.55,0,.8,.45),opacity .9s ease-in
}
.eb{z-index:1;background:linear-gradient(145deg,#8E3153,#64233F);border:1px solid rgba(255,210,220,.25);border-radius:8px;box-shadow:0 22px 44px rgba(10,8,20,.48)}
.ef{z-index:3;background:linear-gradient(145deg,#C96B89 0%,#A83D5C 58%,#923451 100%);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);overflow:hidden}
.ef i{position:absolute;inset:0}
.ef .l{clip-path:polygon(0 0,50% 55%,0 100%);background:linear-gradient(145deg,rgba(255,196,211,.28),rgba(70,15,39,.18))}
.ef .r{clip-path:polygon(100% 0,50% 55%,100% 100%);background:linear-gradient(215deg,rgba(255,196,211,.18),rgba(70,15,39,.16))}
.ef .b{clip-path:polygon(0 100%,50% 55%,100% 100%);background:linear-gradient(180deg,rgba(255,220,230,.2),rgba(255,239,243,.1))}
.fl{z-index:5;filter:drop-shadow(0 5px 5px rgba(10,8,20,.32));width:var(--E);height:var(--FH);margin:0;perspective:900px}
.fi{position:absolute;inset:0;transform-origin:50% 0;transform-style:preserve-3d}
.ff,.fk{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{background:linear-gradient(145deg,#F0B3C2,#D77F99)}
.fk{background:linear-gradient(to top,rgba(60,12,32,.22),transparent 60%),#A83D5C;transform:rotateX(180deg);clip-path:polygon(0 100%,100% 100%,50% 0)}
.s-open .fi{animation:flap .9s linear forwards}
.s-open .fl{animation:flz .9s linear forwards}
@keyframes flap{0%{transform:rotateX(0deg);animation-timing-function:cubic-bezier(.4,0,.8,.6)}50%{transform:rotateX(90deg);animation-timing-function:cubic-bezier(.2,.4,.4,1)}100%{transform:rotateX(180deg)}}
@keyframes flz{0%,49.9%{z-index:5}50%,100%{z-index:0}}
/* Wax seal */
.seal{
 z-index:7;width:var(--seal-size);height:var(--seal-size);padding:0;border:2px solid rgba(255,221,228,.65);border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 35% 30%,#F095AA,#BE123C 58%,#7D173D);color:#FFEAF0;
 font-size:var(--seal-font);line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 3px rgba(255,255,255,.1);
 transform:translate(-50%,-50%) translateY(var(--sealY))
}
.s-seal .seal{
 transition:transform .45s ease-in,opacity .45s ease-in
}
.seal::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(240,149,170,.72);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.8);opacity:.9}to{transform:scale(1.6);opacity:0}}
.s-seal .seal{transform:translate(-50%,-50%) translateY(var(--sealY)) scale(1.5) rotate(14deg);opacity:0;pointer-events:none}
.s-seal .seal::after{animation:none}
.hint{position:absolute;left:0;right:0;margin:0;text-align:center;top:calc(50% + var(--hint-offset));color:var(--hint);font:600 1.55rem/1.2 "Caveat",cursive;transition:opacity .4s}
.s-seal .hint{opacity:0}
/* Three-panel folded letter */
.lt{z-index:2;width:var(--W);height:var(--H);margin:0;transform-style:preserve-3d;transform:translate(-50%,-50%) translateY(var(--y0)) scale(var(--s0))}
.s-rise .lt{transform:translate(-50%,-50%) translateY(var(--y1)) scale(var(--s0));transition:transform 1.3s cubic-bezier(.3,.1,.2,1)}
.s-out .lt{z-index:8;transform:translate(-50%,-50%) translateY(0) scale(var(--s1));transition:transform .9s cubic-bezier(.5,0,.2,1)}
.s-unfold .lt{transform:translate(-50%,-50%) translateY(0) scale(1);transition:transform 1.8s cubic-bezier(.4,0,.2,1)}
.s-out .eb,.s-out .ef{transform:translate(-50%,-50%) translateY(calc(var(--dy) + var(--drop)));opacity:0}
.s-out .fl{transform:translate(-50%,-50%) translateY(calc(var(--flapY) + var(--drop)));opacity:0}
 .pn{position:absolute;left:0;top:0;width:100%;height:var(--P);transform-style:preserve-3d}
.p0{top:0;transform-origin:50% 100%;transform:translateZ(2px) rotateX(-180deg);transition:transform 1.1s cubic-bezier(.45,0,.2,1)}
.p1{top:var(--P)}
 .p2{transform-origin:50% 0;transform:translateZ(4px) rotateX(180deg);transition:transform 1.1s cubic-bezier(.45,0,.2,1) .5s}
.s-unfold .p0,.s-unfold .p2{transform:translateZ(0) rotateX(0deg)}
.f,.b{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f{background:var(--paper)}
.b{transform:rotateX(180deg);background:var(--paper2);display:flex;align-items:center;justify-content:center}
.p1 .f{box-shadow:0 8px 22px rgba(0,0,0,.3);transition:box-shadow .6s}
.s-unfold .p1 .f{box-shadow:0 0 0 rgba(0,0,0,0)}
.to{font:700 clamp(24px,5vw,40px)/1 "DM Serif Display",serif;color:var(--rose)}
.body{
 box-sizing:border-box;width:var(--W);height:var(--H);padding:68px clamp(18px,4vw,30px);
 font:500 var(--fs)/var(--lh) "Caveat",cursive;color:var(--ink);background-color:var(--paper);overflow-wrap:anywhere;word-break:normal;
 background-image:linear-gradient(transparent calc(var(--lh) - 1px),rgba(168,61,92,.16) 0),
 linear-gradient(transparent 33.2%,rgba(60,25,40,.07) 33.33%,transparent 33.7%,transparent 66.3%,rgba(60,25,40,.07) 66.67%,transparent 67%);
 background-size:100% var(--lh),100% 100%;background-position:0 68px,0 0;
 background-repeat:repeat-y,no-repeat;background-attachment:local,scroll
}
.f .body{position:absolute;left:0}
.body p{margin:0 0 var(--lh)}
.body .dt{text-align:right;color:#8B5368;font-size:.72em;font-family:"Manrope",sans-serif;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.body .greeting{font-size:1.18em;font-weight:700;color:var(--plum);margin-bottom:var(--lh)}
.body .so,.body .ps{margin:0}
.body .nm{font-size:1.35em;font-weight:700;color:var(--rose);margin:0 0 var(--lh)}
.body .ps{font-size:.8em;color:#805366}
 .sheet{z-index:10;margin:0;transform:translate(-50%,-50%);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;opacity:0;visibility:hidden;outline:none;box-shadow:0 10px 36px rgba(0,0,0,.3);transition:opacity .4s;scrollbar-width:thin;scrollbar-color:#BE5678 transparent}
.sheet::after{content:"";display:block;height:96px}
.s-done .sheet{opacity:1;visibility:visible}
.s-done .page-title{opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s .25s}
.s-done .lt{visibility:hidden;transition:visibility 0s .45s}
.replay{
 position:absolute;z-index:28;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;visibility:hidden;
 border:1.5px solid rgba(255,220,229,.7);border-radius:99px;padding:.72em 1.4em;background:#7D2948;color:#FFF5F5;
 font:700 .88rem "Manrope",sans-serif;letter-spacing:.02em;box-shadow:0 6px 18px rgba(0,0,0,.35);
 cursor:pointer;transition:opacity .4s .3s,transform .4s .3s,background .2s
}
.replay:hover{background:#A83D5C}
.s-done .replay{opacity:1;visibility:visible;transform:translate(-50%,0)}
.reset *{transition:none!important;animation:none!important}
@media(max-width:560px){
 .page-title{top:clamp(14px,3vh,24px);font-size:clamp(22px,6vw,29px)}
 .nav-back{width:38px;height:38px}
 .replay{bottom:max(10px,env(safe-area-inset-bottom));font-size:.82rem}
}
@media(max-height:520px) and (orientation:landscape){
 .page-title{top:8px;font-size:22px}
 .nav-back{top:8px}
 .replay{bottom:8px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
 .seal::after{display:none}
}
</style>
</head>
<body>
<a class="nav-back" href="index.html" aria-label="Back to PickMe">
 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
</a>
<main class="scene" id="scene">
 <h1 class="page-title">A Letter for You</h1>
 <div class="eb" aria-hidden="true"></div>
 <div class="lt" id="lt" aria-hidden="true"></div>
 <div class="ef" aria-hidden="true"><i class="l"></i><i class="r"></i><i class="b"></i></div>
 <div class="fl" aria-hidden="true"><div class="fi"><div class="ff"></div><div class="fk"></div></div></div>
 <button class="seal" id="seal" type="button" aria-label="Break the seal and open your letter">&#9829;&#xFE0E;</button>
 <p class="hint" id="hint">A little note, sealed with love. Tap to open.</p>
 <article class="body sheet" id="sheet" tabindex="-1" aria-label="Your letter" aria-hidden="true"></article>
 <button class="replay" id="replay" type="button">Read again</button>
</main>
<script>
(function(){
 'use strict';
 var scene=document.getElementById('scene');
 var lt=document.getElementById('lt');
 var sheet=document.getElementById('sheet');
 var seal=document.getElementById('seal');
 var replay=document.getElementById('replay');
 var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 var K=reduced?0.001:1;
 var busy=false;
 var panelHeight=0;
 var timers=[];
 var params=new URLSearchParams(window.location.search);
 var to='',from='',message='';
 function decodeLetter(){
  var encoded=params.get('d');
  if(encoded){
   try{
    var decoded=JSON.parse(decodeURIComponent(atob(encoded)));
    to=typeof decoded.t==='string'?decoded.t:'';
    from=typeof decoded.f==='string'?decoded.f:'';
    message=typeof decoded.m==='string'?decoded.m:'';
   }catch(error){console.warn('Could not decode letter data:',error)}
  }else{
   to=params.get('to')||'';
   from=params.get('from')||'';
   message=params.get('msg')||'';
  }
 }
 function paragraph(text,className){
  var p=document.createElement('p');
  if(className)p.className=className;
  p.textContent=text;
  return p;
 }
 function buildLetter(){
  var date=document.createElement('p');
  date.className='dt';
  date.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  var greeting=paragraph('Dear '+(to.trim()||'you')+',','greeting');
  sheet.append(date,greeting);
  var lines=message.split(/\r?\n/).map(function(line){return line.trim()}).filter(Boolean);
  if(!lines.length)lines=['A little note, sent with love.'];
  lines.forEach(function(line){sheet.appendChild(paragraph(line))});
  sheet.append(paragraph('With love,','so'),paragraph(from.trim()||'Someone who cares','nm'),paragraph('Made with a little love on PickMe.','ps'));
 }
 function px(name,value){scene.style.setProperty(name,value+'px')}
 function layout(){
  var vw=scene.clientWidth;
  var vh=scene.clientHeight;
  if(!vw||!vh)return;
  var W=Math.max(240,Math.min(vw-24,560));
  var H=Math.max(220,vh-20);
  var P=H/3;
  panelHeight=P;
  var E=Math.min(vw*.82,360);
  var EH=E*.68;
  var s0=Math.min(.84*E/W,.78*EH/P);
  var h0=P*s0;
  var need=.5*EH+h0+6;
  var dy=Math.max(vh*.08,need-vh/2+14);
  var y0=dy-.05*EH;
  var ty=h0/2+.45*EH+6;
  px('--W',W);px('--H',H);px('--P',P);px('--E',E);px('--EH',EH);px('--dy',dy);
  px('--y0',y0);px('--y1',y0-ty);px('--drop',vh*.7);px('--FH',EH*.86);px('--flapY',dy-EH/2+(EH*.86)/2);px('--seal-size',E*.18);px('--seal-font',E*.078);px('--sealY',dy+EH*.34);px('--hint-offset',dy+EH/2+28);
  Array.prototype.forEach.call(lt.querySelectorAll('.pn'),function(panel,index){panel.style.top=(index*P)+'px';var copy=panel.querySelector('.body');if(copy)copy.style.top=(-index*P)+'px'});
  scene.style.setProperty('--s0',s0);
  scene.style.setProperty('--s1',Math.min(1,s0*1.3));
  var fs=Math.min(26,W/14);
  px('--fs',fs);px('--lh',fs*1.5);
  while(fs>17&&sheet.scrollHeight-96>H+1){fs-=.5;px('--fs',fs);px('--lh',fs*1.5)}
 }
 function buildFoldedLetter(){
  lt.replaceChildren();
  for(var i=0;i<3;i++){
   var panel=document.createElement('div');
   panel.className='pn p'+i;
   panel.style.top=(i*panelHeight)+'px';
   var front=document.createElement('div');
   front.className='f';
   var copy=document.createElement('div');
   copy.className='body';
   copy.style.top=(-i*panelHeight)+'px';
   Array.prototype.forEach.call(sheet.childNodes,function(node){copy.appendChild(node.cloneNode(true))});
   front.appendChild(copy);
   panel.appendChild(front);
   if(i!==1){
    var back=document.createElement('div');
    back.className='b';
    if(i===2){
     var label=document.createElement('span');
     label.className='to';
     label.textContent='For you';
     back.appendChild(label);
    }
    panel.appendChild(back);
   }
   lt.appendChild(panel);
  }
 }
 function at(ms,fn){
  var timer=window.setTimeout(fn,ms*K);
  timers.push(timer);
 }
 function clearTimers(){timers.forEach(window.clearTimeout);timers=[]}
 function finishImmediately(){
  ['s-seal','s-open','s-rise','s-out','s-unfold','s-done'].forEach(function(name){scene.classList.add(name)});
  sheet.setAttribute('aria-hidden','false');
  sheet.focus({preventScroll:true});
 }
 function play(){
  if(busy)return;
  busy=true;
  seal.disabled=true;
  if(reduced){finishImmediately();return}
  scene.classList.add('s-seal');
  at(350,function(){scene.classList.add('s-open')});
  at(1150,function(){scene.classList.add('s-rise')});
  at(2450,function(){scene.classList.add('s-out')});
  at(3250,function(){scene.classList.add('s-unfold')});
  at(5150,function(){
   scene.classList.add('s-done');
   sheet.setAttribute('aria-hidden','false');
   sheet.focus({preventScroll:true});
  });
 }
 function reset(){
  clearTimers();
  scene.classList.add('reset');
  scene.classList.remove('s-seal','s-open','s-rise','s-out','s-unfold','s-done');
  sheet.setAttribute('aria-hidden','true');
  sheet.scrollTop=0;
  void scene.offsetWidth;
  scene.classList.remove('reset');
  busy=false;
  seal.disabled=false;
 }
 decodeLetter();
 buildLetter();
 layout();
 buildFoldedLetter();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
 window.addEventListener('resize',layout,{passive:true});
 window.addEventListener('orientationchange',function(){window.setTimeout(layout,80)},{passive:true});
 seal.addEventListener('click',play);
 replay.addEventListener('click',function(event){event.stopPropagation();reset();seal.focus({preventScroll:true})});
 document.addEventListener('keydown',function(event){if(event.key==='Escape'&&busy){event.preventDefault();reset();seal.focus({preventScroll:true})}});
})();
</script>
</body>
</html>

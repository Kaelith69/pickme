<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Letter For You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink-dark: #1a1218;
            --ink-brown: #25191e;
            --paper-white: #1a1218;
            --paper-cream: #2d1f27;
            --ink-blue: #1f1620;
            --accent-plum: #be123c;
            /* Aligned with Primary Dark (Rose) */
            --accent-deep-red: #881337;
            --accent-silver: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--paper-white);
            font-family: 'Playfair Display', serif;
            color: var(--accent-silver);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #1a1218 0%, #0f0a0d 50%, #1a0f1a 100%);
        }

        /* === PAPER TEXTURE === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2" /></filter><rect width="100" height="100" fill="%231a1218" opacity="1"/><rect width="100" height="100" fill="%23fff" opacity="0.03" filter="url(%23noise)"/></svg>');
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(139, 58, 98, 0.04) 50%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* === MAIN CONTAINER === */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            perspective: 1000px;
        }

        /* === INK SPLASH BACKGROUND === */
        .ink-bg {
            position: absolute;
            top: -80px;
            right: -120px;
            width: 400px;
            height: 400px;
            opacity: 0.06;
            filter: blur(1px);
            pointer-events: none;
            z-index: 0;
        }

        .ink-bg-bottom {
            position: absolute;
            bottom: -100px;
            left: -150px;
            width: 450px;
            height: 450px;
            opacity: 0.05;
            filter: blur(1px);
            pointer-events: none;
            z-index: 0;
        }

        /* === ENVELOPE === */
        .envelope-container {
            position: relative;
            z-index: 20;
            margin-bottom: 40px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .envelope-container:active {
            transform: scale(0.98);
        }

        .envelope {
            position: relative;
            width: 100%;
            max-width: 340px;
            height: 220px;
            margin: 0 auto;
            background: linear-gradient(135deg, #2d1f27 0%, #1f1620 100%);
            border: 1.5px solid rgba(155, 143, 168, 0.2);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(155, 143, 168, 0.1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .envelope:hover {
            transform: translateY(-8px);
            box-shadow:
                0 16px 40px rgba(139, 58, 98, 0.3),
                inset 0 1px 2px rgba(155, 143, 168, 0.1);
        }

        /* Envelope paper lines */
        .envelope::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(90deg, transparent 48%, rgba(155, 143, 168, 0.05) 48%, rgba(155, 143, 168, 0.05) 52%, transparent 52%),
                linear-gradient(180deg, transparent 48%, rgba(155, 143, 168, 0.03) 48%, rgba(155, 143, 168, 0.03) 52%, transparent 52%);
            background-size: 200px 200px;
            pointer-events: none;
            opacity: 0.4;
            z-index: 2;
        }

        .envelope-body {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        /* === INK SEAL === */
        .ink-seal {
            position: relative;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            filter: drop-shadow(0 3px 8px rgba(26, 20, 16, 0.3));
        }

        .ink-seal::before {
            content: '';
            position: absolute;
            inset: -8px;
            background: radial-gradient(circle, rgba(26, 20, 16, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .ink-seal svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(2px 2px 4px rgba(26, 20, 16, 0.4));
        }

        /* Flap */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 110px solid var(--paper-cream);
            transform-origin: top center;
            transform: rotateX(0deg);
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 6;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }

        .envelope-flap::after {
            content: '';
            position: absolute;
            top: -108px;
            left: -168px;
            right: -168px;
            border-left: 168px solid transparent;
            border-right: 168px solid transparent;
            border-top: 108px solid #1a1115;
            opacity: 0.7;
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-bottom: 100px solid #1a1115;
            z-index: 2;
        }

        .envelope-left {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            height: 0;
            border-top: 110px solid transparent;
            border-bottom: 110px solid transparent;
            border-left: 110px solid #25191e;
            z-index: 2;
        }

        .envelope-right {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            height: 0;
            border-top: 110px solid transparent;
            border-bottom: 110px solid transparent;
            border-right: 110px solid #1f1519;
            z-index: 2;
        }

        .click-text {
            font-family: 'Dancing Script', cursive;
            font-size: 18px;
            color: var(--accent-plum);
            margin-top: 24px;
            text-align: center;
            opacity: 0.6;
            animation: breathe 3s ease-in-out infinite;
            font-weight: 400;
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: 0.4;
                transform: translateY(0);
            }

            50% {
                opacity: 0.7;
                transform: translateY(-2px);
            }
        }

        /* === ENVELOPE OPEN STATE === */
        .envelope-container.open .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-container.open .ink-seal {
            transform: scale(0) rotate(180deg);
            opacity: 0;
        }

        /* === LETTER MODAL === */
        .letter-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 10, 13, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .letter-modal.show {
            display: flex;
            opacity: 1;
        }

        .letter-paper {
            position: relative;
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            background: linear-gradient(135deg, #2d1f27 0%, #25191e 100%);
            padding: 60px 40px;
            border-radius: 1px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.8),
                0 0 1px rgba(155, 143, 168, 0.2),
                inset 0 1px 0 rgba(155, 143, 168, 0.1);
            overflow-y: auto;
            transform: scale(0.88) rotateX(-5deg);
            opacity: 0;
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            z-index: 1;
        }

        .letter-paper.appear {
            transform: scale(1) rotateX(0deg);
            opacity: 1;
        }

        /* Paper texture on letter */
        .letter-paper::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                url('data:image/svg+xml,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><filter id="noise2"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="5" seed="3" /></filter><rect width="200" height="200" fill="%232d1f27" opacity="1"/><rect width="200" height="200" fill="%23fff" opacity="0.02" filter="url(%23noise2)"/></svg>');
            pointer-events: none;
            z-index: 0;
            opacity: 0.8;
        }

        .letter-paper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, transparent 0%, rgba(139, 58, 98, 0.08) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .letter-content {
            position: relative;
            z-index: 2;
            font-size: 17px;
            line-height: 1.85;
        }

        .letter-date {
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            font-weight: 400;
            color: var(--accent-plum);
            margin-bottom: 35px;
            opacity: 0.8;
            text-align: right;
        }

        .letter-greeting {
            font-family: 'Dancing Script', cursive;
            font-size: 42px;
            font-weight: 700;
            color: var(--accent-plum);
            margin-bottom: 30px;
            line-height: 1.2;
            opacity: 0;
            transform: translateY(10px);
            animation: slideInUp 0.8s ease 0.3s forwards;
        }

        .letter-body {
            color: var(--accent-silver);
            font-size: 18px;
            line-height: 1.9;
            margin-bottom: 20px;
            font-family: 'Dancing Script', cursive;
        }

        .letter-body p {
            margin-bottom: 18px;
            opacity: 0;
            transform: translateY(8px);
            animation: slideInUp 0.7s ease forwards;
        }

        .letter-body p:nth-child(1) {
            animation-delay: 0.5s;
        }

        .letter-body p:nth-child(2) {
            animation-delay: 0.6s;
        }

        .letter-body p:nth-child(3) {
            animation-delay: 0.7s;
        }

        .letter-body p:nth-child(4) {
            animation-delay: 0.8s;
        }

        .letter-body p:nth-child(5) {
            animation-delay: 0.8s;
        }

        .letter-sign {
            margin-top: 35px;
            text-align: right;
            opacity: 0;
            animation: slideInUp 0.7s ease 0.9s forwards;
        }

        .sign-name {
            font-family: 'Dancing Script', cursive;
            font-size: 38px;
            font-weight: 700;
            color: var(--accent-plum);
            line-height: 1;
            margin-bottom: 8px;
        }

        .sign-extra {
            font-family: 'Dancing Script', cursive;
            font-size: 16px;
            color: var(--accent-silver);
            opacity: 0.7;
        }

        .letter-deco {
            text-align: center;
            font-size: 24px;
            margin: 28px 0;
            letter-spacing: 12px;
            color: var(--accent-plum);
            opacity: 0;
            animation: slideInUp 0.7s ease 0.8s forwards;
        }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 22px;
            background: none;
            border: none;
            font-family: 'Fraunces', serif;
            font-size: 14px;
            color: var(--accent-plum);
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease;
            z-index: 10;
            padding: 4px 8px;
        }

        .close-btn:hover {
            opacity: 1;
        }

        /* === TITLE === */
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 56px;
            font-weight: 700;
            color: var(--accent-plum);
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: -1px;
            opacity: 0;
            animation: slideInDown 0.9s ease 0.2s forwards;
            position: relative;
            z-index: 15;
        }

        .title::after {
            content: '';
            display: block;
            width: 80px;
            height: 2px;
            background: var(--accent-plum);
            margin: 12px auto 0;
            opacity: 0.5;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === BUTTON === */
        .create-btn {
            display: inline-block;
            margin-top: 35px;
            padding: 14px 32px;
            background: none;
            border: 1.5px solid var(--accent-plum);
            color: var(--accent-plum);
            font-family: 'Fraunces', serif;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            position: relative;
            z-index: 15;
            overflow: hidden;
        }

        .create-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-plum);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
            z-index: -1;
        }

        .create-btn:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .create-btn:hover {
            color: var(--paper-white);
        }

        /* === SCROLLBAR === */
        .letter-paper::-webkit-scrollbar {
            width: 6px;
        }

        .letter-paper::-webkit-scrollbar-track {
            background: transparent;
        }

        .letter-paper::-webkit-scrollbar-thumb {
            background: rgba(155, 143, 168, 0.15);
            border-radius: 3px;
        }

        .letter-paper::-webkit-scrollbar-thumb:hover {
            background: rgba(155, 143, 168, 0.3);
        }

        /* === RESPONSIVE === */
        @media (max-width: 650px) {
            .container {
                width: 92%;
            }

            .title {
                font-size: 44px;
                margin-bottom: 40px;
            }

            .envelope {
                height: 190px;
                max-width: 300px;
            }

            .envelope-flap {
                border-left: 150px solid transparent;
                border-right: 150px solid transparent;
                border-top: 95px solid var(--paper-cream);
            }

            .envelope-flap::after {
                top: -93px;
                left: -148px;
                right: -148px;
                border-left: 148px solid transparent;
                border-right: 148px solid transparent;
                border-top: 93px solid #ddd8d1;
            }

            .envelope-bottom {
                border-left: 150px solid transparent;
                border-right: 150px solid transparent;
                border-bottom: 85px solid #ddd8d1;
            }

            .envelope-left {
                border-top: 95px solid transparent;
                border-bottom: 95px solid transparent;
                border-left: 95px solid #d5cfca;
            }

            .envelope-right {
                border-top: 95px solid transparent;
                border-bottom: 95px solid transparent;
                border-right: 95px solid #cec7bf;
            }

            .letter-paper {
                padding: 45px 35px;
            }

            .letter-greeting {
                font-size: 36px;
            }

            .letter-content {
                font-size: 15px;
            }

            .sign-name {
                font-size: 32px;
            }
        }

        /* === NAVIGATION === */
        .nav-back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--accent-silver);
            transition: all 0.3s ease;
            z-index: 1000;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-2px);
            color: var(--accent-plum);
        }

        @media (max-width: 768px) {
            .nav-back-btn {
                top: 16px;
                left: 16px;
                width: 40px;
                height: 40px;
            }
        }
    </style>

<style>
/* PickMe responsive letter reader correction */
:root { --ink-dark:#211C2A; --ink-brown:#292635; --paper-white:#171621; --paper-cream:#302C3B; --ink-blue:#211E2D; --accent-plum:#A995F2; --accent-deep-red:#6650B4; --accent-silver:#DDD5E4; --romance-gold:#F0D17D; --romance-coral:#F095AA; }
html { min-width:320px; min-height:100%; overflow-x:clip; }
body {
 min-width:320px; min-height:100svh; min-height:100dvh; overflow-x:hidden; overflow-y:auto;
 background:radial-gradient(ellipse 60% 44% at 10% 8%,rgba(126,99,213,.23),transparent 72%),radial-gradient(ellipse 55% 45% at 92% 92%,rgba(225,125,153,.18),transparent 72%),radial-gradient(circle,rgba(210,199,241,.1) 1px,transparent 1.5px) 0 0/24px 24px,linear-gradient(145deg,#171621,#211E2D 55%,#302332);
}

<body>
    <!-- Back Navigation -->
    <a href="index.html" class="nav-back-btn" aria-label="Back to Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </a>
    <svg class="ink-bg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <g fill="currentColor" opacity="0.4">
            <path d="M80 30 Q70 50 85 70 Q100 60 95 40 Z" fill="#8b3a62" />
            <circle cx="120" cy="60" r="25" opacity="0.3" fill="#4a1a2f" />
            <path d="M50 90 Q60 110 75 100 Q65 85 50 90 Z" fill="#8b3a62" />
            <circle cx="140" cy="110" r="18" opacity="0.25" fill="#4a1a2f" />
        </g>
    </svg>

    <svg class="ink-bg-bottom" viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
        <g fill="currentColor" opacity="0.35">
            <path d="M180 150 Q170 180 195 200 Q210 180 195 160 Z" fill="#8b3a62" />
            <circle cx="80" cy="180" r="30" opacity="0.3" fill="#4a1a2f" />
            <path d="M120 80 Q130 100 145 95 Q135 75 120 80 Z" fill="#8b3a62" />
        </g>
    </svg>

    <div class="container">
        <h1 class="title" id="pageTitle">For You</h1>

        <div class="envelope-container" id="envelopeContainer">
            <div class="envelope" id="envelope">
                <div class="envelope-body">
                    <div class="ink-seal" id="inkSeal">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2"
                                opacity="0.4" />
                            <path d="M50 25 Q65 40 50 55 Q35 40 50 25" fill="currentColor" />
                            <circle cx="50" cy="50" r="8" fill="currentColor" opacity="0.6" />
                        </svg>
                    </div>
                </div>
                <div class="envelope-flap"></div>
                <div class="envelope-bottom"></div>
                <div class="envelope-left"></div>
                <div class="envelope-right"></div>
            </div>
            <p class="click-text">tap to open</p>
        </div>

        <!-- Redirect to home instead of an alert -->
        <a href="index.html" class="create-btn">Make Your Own</a>
    </div>

    <!-- Letter Modal -->
    <div class="letter-modal" id="letterModal">
        <div class="letter-paper" id="letterPaper">
            <button class="close-btn" onclick="closeLetter()">close</button>
            <div class="letter-content">
                <div class="letter-date" id="letterDate">February 14th, 2025</div>
                <div class="letter-greeting" id="letterGreeting">My Love,</div>
                <div class="letter-body" id="letterBody">
                    <p>Loading your letter...</p>
                </div>
                <div class="letter-deco">✦ ✦ ✦</div>
                <div class="letter-sign">
                    <div class="sign-name" id="signName">Your Name,</div>
                    <div class="sign-extra" id="signExtra">with love ~</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isOpen = false;

        const envelopeContainer = document.getElementById('envelopeContainer');
        const letterModal = document.getElementById('letterModal');
        const letterPaper = document.getElementById('letterPaper');

        envelopeContainer.addEventListener('click', openEnvelope);

        function openEnvelope() {
            if (isOpen) return;
            isOpen = true;

            envelopeContainer.classList.add('open');

            setTimeout(() => {
                letterModal.classList.add('show');
                setTimeout(() => {
                    letterPaper.classList.add('appear');
                }, 50);
            }, 900);
        }

        function closeLetter() {
            letterPaper.classList.remove('appear');
            setTimeout(() => {
                letterModal.classList.remove('show');
                envelopeContainer.classList.remove('open');
                isOpen = false;
            }, 500);
        }

        letterModal.addEventListener('click', (e) => {
            if (e.target === letterModal) closeLetter();
        });

        // Support URL parameters for dynamic content
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const d = params.get('d'); // Support obfuscated data

            let to = '';
            let from = '';
            let msg = '';

            if (d) {
                try {
                    const decoded = JSON.parse(decodeURIComponent(atob(d)));
                    if (decoded.t) to = decoded.t;
                    if (decoded.f) from = decoded.f;
                    if (decoded.m) msg = decoded.m;
                } catch (e) {
                    console.error('Failed to decode letter data', e);
                }
            } else {
                if (params.has('to')) to = params.get('to');
                if (params.has('from')) from = params.get('from');
                if (params.has('msg')) msg = params.get('msg');
            }

            if (to) {
                document.getElementById('letterGreeting').textContent = to + ',';
            }

            if (from) {
                document.getElementById('signName').textContent = from;
            }

            // Date handling (optional)
            const date = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('letterDate').textContent = date;

            if (msg) {
                const bodyEl = document.getElementById('letterBody');
                bodyEl.innerHTML = '';
                const messages = msg.split('\n').filter(m => m.trim() !== '');
                messages.forEach((m, index) => {
                    const p = document.createElement('p');
                    p.textContent = m;
                    p.style.animationDelay = `${0.5 + (index * 0.2)}s`;
                    bodyEl.appendChild(p);
                });
            }
        });
    </script>
</body>
